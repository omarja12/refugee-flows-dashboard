name: run

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check.py
      - name: Serve with gunicorn
        run: |
          gunicorn app:server --bind 127.0.0.1:8050 --daemon
          sleep 5
          curl -sf http://127.0.0.1:8050/ > /dev/null && echo "dashboard is up"
